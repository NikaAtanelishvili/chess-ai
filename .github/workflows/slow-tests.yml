name: Slow tests

on:
  workflow_dispatch:
  schedule:
    - cron: "17 3 * * *" # nightly

permissions:
  contents: read

jobs:
  slow:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up uv
        uses: astral-sh/setup-uv@v10
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Install
        run: uv sync --locked --all-groups --all-extras

      # pytest exits with 5 when no test is selected; that is not a failure here.
      - name: Slow tests
        run: uv run pytest -m slow || [ $? -eq 5 ]
