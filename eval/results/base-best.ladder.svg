<text class="tick" x="60" y="172.0" text-anchor="end">2500</text>
<line class="grid" x1="68" x2="544" y1="116.0" y2="116.0"/>
<text class="tick" x="60" y="120.0" text-anchor="end">2700</text>
<line class="grid" x1="68" x2="544" y1="64.0" y2="64.0"/>
<text class="tick" x="60" y="68.0" text-anchor="end">2900</text>
<line class="axis" x1="68" x2="544" y1="324" y2="324"/>
<text class="tick" x="100.8" y="342" text-anchor="middle">50</text>
<text class="tick" x="182.9" y="342" text-anchor="middle">100</text>
<text class="tick" x="265.0" y="342" text-anchor="middle">200</text>
<text class="tick" x="347.0" y="342" text-anchor="middle">400</text>
<text class="tick" x="429.1" y="342" text-anchor="middle">800</text>
<text class="tick" x="511.2" y="342" text-anchor="middle">1600</text>
<text class="axis-title" x="306.0" y="368" text-anchor="middle">Playouts per move (log scale)</text>
<text class="axis-title" transform="translate(18 194.0) rotate(-90)" text-anchor="middle">Rating, Stockfish scale</text>
<line class="axis" x1="68" x2="544" y1="220.0" y2="220.0"/>
<text class="label" x="550" y="224.0">UCI_Elo 2300</text>
<line class="line" x1="100.8" y1="267.0" x2="511.2" y2="144.5"/>
<text class="label" x="78" y="80">Line: fit, +94 Elo per doubling (95% CI +62 to +129)</text>
<g><title>50 playouts: 2150 (2010 to 2277), 32 games, 7 / 5 / 20</title>
