# Main run on Kaggle: the base model on one T4 GPU (of the T4 x2 machine), fp16 mixed precision.
# Batch size and speed flags: the fastest combination in session 1's benchmark (10,639
# positions/s). Epochs: the most whose estimated run time (10.2 h with validation and
# checkpoints) leaves at least 1 h of the 11h15m session. See docs/TRAINING.md.
model: base
batch_size: 2048
epochs: 5                  # passes over the train split: 37,572 steps each, 187,860 in all
optimizer: adamw
lr: 0.001
weight_decay: 0.0001
warmup_steps: 2000
min_lr_ratio: 0.01
value_loss_weight: 0.5
label_smoothing: 0.05
grad_clip: 5.0
amp: true
compile: true
channels_last: false       # slower than plain NCHW once compiled
log_every: 200
val_every: 2500            # every 5.1M positions
val_batches: 25            # fixed validation subset: 51,200 positions
checkpoint_minutes: 20
keep_checkpoints: 3
num_workers: 1             # 180k positions/s, 17x what base needs; GPU 1 runs a second job
seed: 0
