name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: lint, types, tests (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v7

      - name: Set up uv
        uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          python-version: ${{ matrix.python-version }}
          enable-cache: true
          cache-dependency-glob: uv.lock

      # --locked fails if uv.lock is stale; torch resolves from the CPU index.
      - name: Install
        run: uv sync --locked --all-groups --all-extras

      - name: Ruff lint
        run: uv run ruff check --output-format=github .

      - name: Ruff format
        run: uv run ruff format --check .

      - name: mypy
        run: uv run mypy

      - name: mypy --strict (core packages)
        run: uv run mypy --strict src/chessnet/encoding

      - name: Tests
        run: uv run pytest -m "not slow" --cov=chessnet --cov-report=term --cov-fail-under=80

      - name: Coverage of the encoding package (100%)
        run: uv run coverage report --include="*/chessnet/encoding/*" --fail-under=100
