<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 380" width="640" height="380" class="viz" role="img" aria-label="Rating against playouts on Stockfish's scale">
<style>
  .viz { --surface: #ffffff; --ink: #191919; --ink-2: #666666; --grid: #e7e7e7;
         --axis: #c2c2c2; --series: #257de0; font-family: system-ui, -apple-system,
         "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
  @media (prefers-color-scheme: dark) {
    .viz { --surface: #191919; --ink: #efefef; --ink-2: #9c9c9c; --grid: #303030;
           --axis: #474747; --series: #338ced; }
  }
  .surface { fill: var(--surface); }
  .title { fill: var(--ink); font-size: 15px; font-weight: 600; }
  .subtitle, .tick, .axis-title, .label { fill: var(--ink-2); font-size: 11.5px; }
  .grid { stroke: var(--grid); stroke-width: 1; }
  .axis { stroke: var(--axis); stroke-width: 1; }
  .line { fill: none; stroke: var(--series); stroke-width: 2; stroke-linejoin: round;
          stroke-linecap: round; }
  .whisker { stroke: var(--series); stroke-width: 2; stroke-linecap: round; opacity: 0.55; }
  .dot { fill: var(--series); stroke: var(--surface); stroke-width: 2; }
  .open { fill: var(--surface); stroke: var(--series); stroke-width: 2; }
  .hit { fill: transparent; }
</style>
<rect class="surface" width="640" height="380" rx="8"/>
<text class="title" x="68" y="26">base-best.pt: rating against playouts</text>
<text class="subtitle" x="68" y="45">Against Stockfish 16 at UCI_Elo 2300. Stockfish scale, not FIDE or Lichess; 95% intervals.</text>
<line class="grid" x1="68" x2="544" y1="324.0" y2="324.0"/>
<text class="tick" x="60" y="328.0" text-anchor="end">1900</text>
<line class="grid" x1="68" x2="544" y1="272.0" y2="272.0"/>
<text class="tick" x="60" y="276.0" text-anchor="end">2100</text>
