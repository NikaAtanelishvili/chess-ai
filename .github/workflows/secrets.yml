name: Secret scan

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "41 4 * * 1" # weekly

permissions:
  contents: read
  pull-requests: write # lets gitleaks-action comment on findings

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # Scans the pushed/PR commit range; on schedule and manual runs, the full history.
      - name: gitleaks (action)
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Full-history scan on every push and pull request.
      - name: gitleaks (full history)
        if: github.event_name == 'push' || github.event_name == 'pull_request'
        run: >
          docker run --rm --user "$(id -u):$(id -g)" -v "$PWD:/repo"
          ghcr.io/gitleaks/gitleaks:v8.30.1
          git /repo --redact --verbose --exit-code 1
