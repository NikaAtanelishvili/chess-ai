[project]
name = "chessnet"
dynamic = ["version"]
description = "AlphaZero-style chess engine (CNN + MCTS) trained on Lichess games"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11"
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Games/Entertainment :: Board Games",
]
dependencies = [
    "chess>=1.11",
    "numpy>=1.26",
    "pydantic>=2.7",
    "pyyaml>=6.0",
    "torch>=2.3",
    "typer>=0.12",
    "zstandard>=0.22",
]

[project.optional-dependencies]
train = [
    "tensorboard>=2.16",
]
onnx = [
    "onnx>=1.17",
    "onnxruntime>=1.20",
    "onnxscript>=0.2",
]

[project.scripts]
chessnet = "chessnet.cli:app"

[project.urls]
Repository = "https://github.com/NikaAtanelishvili/chess-ai"

[dependency-groups]
dev = [
    "hypothesis>=6.170.17",
    "kaggle>=2.2.5",
    "mypy>=2.4.1",
    "pre-commit>=4.7.0",
    "pytest>=9.2.0",
    "pytest-cov>=7.1.0",
    "ruff>=0.17.6",
    "types-pyyaml>=6.0.12.20261122",
]

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.version]
path = "src/chessnet/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/chessnet"]

# --- PyTorch: CPU wheels by default (see docs/DECISIONS.md) ------------------
[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = [{ index = "pytorch-cpu" }]

# --- Ruff --------------------------------------------------------------------
[tool.ruff]
line-length = 100
src = ["src", "tests"]
force-exclude = true
extend-exclude = ["legacy", "scripts/legacy_bug_demo.py"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP", "SIM", "C4", "PT", "RUF", "N"]

[tool.ruff.lint.isort]
known-first-party = ["chessnet"]
known-local-folder = ["helpers"]

# --- mypy --------------------------------------------------------------------
[tool.mypy]
python_version = "3.11"
files = ["src"]
mypy_path = "src"
check_untyped_defs = true
no_implicit_optional = true
strict_equality = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_unused_configs = true

# Core numerical code is held to strict typing.
[[tool.mypy.overrides]]
module = ["chessnet.encoding.*", "chessnet.search.*", "chessnet.model.*"]
disallow_any_generics = true
disallow_incomplete_defs = true
disallow_subclassing_any = true
disallow_untyped_calls = true
disallow_untyped_decorators = true
disallow_untyped_defs = true
extra_checks = true
no_implicit_reexport = true
warn_return_any = true

# --- pytest / coverage -------------------------------------------------------
[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
pythonpath = ["tests"]
addopts = ["-ra", "--strict-markers", "--strict-config", "--import-mode=importlib", "-p", "pytester"]
markers = [
    "slow: long-running tests, excluded from the default CI job",
    "gpu: needs a CUDA device; skipped without one unless --require-gpu is given",
]
xfail_strict = true

[tool.coverage.run]
source = ["chessnet"]
branch = true
omit = ["*/__main__.py"]

[tool.coverage.report]
show_missing = true
skip_covered = true
exclude_also = ["if TYPE_CHECKING:", "raise NotImplementedError"]
